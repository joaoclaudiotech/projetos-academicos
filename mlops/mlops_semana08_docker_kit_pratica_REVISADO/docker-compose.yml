
services:
  # Serviço principal da prática: API de inferência.
  modelo:
    # Constrói a imagem a partir do Dockerfile local.
    build:
      context: .
      dockerfile: Dockerfile

    # Nome/tag que ficará visível em docker images.
    image: modelo-inferencia:compose

    # Mapeia porta do host para porta do container.
    ports:
      - "8000:8000"

    # Variável simples para mostrar como configurar ambiente.
    environment:
      - MODEL_VERSION=1.0

    # Em desenvolvimento, monta models como volume somente leitura.
    volumes:
      - ./models:/app/models:ro

    # Teste simples de saúde dentro do container.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
